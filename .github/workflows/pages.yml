name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
      #   SITELENS_API_URL  – a hosted Webvieu API, for full reports
      #   SITELENS_CONTACT  – email or https URL where people request API keys
      - name: Configure API endpoint and contact
        env:
          API_URL: ${{ vars.SITELENS_API_URL }}
          CONTACT: ${{ vars.SITELENS_CONTACT }}
        run: |
          if [ -n "$API_URL" ] && ! printf '%s' "$API_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$'; then
            echo "SITELENS_API_URL must be an https:// URL" >&2
            exit 1
          fi
          if [ -n "$CONTACT" ] && ! printf '%s' "$CONTACT" | grep -Eq '^([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|https://[A-Za-z0-9./?=&_%#:-]+)$'; then
            echo "SITELENS_CONTACT must be an email address or an https:// URL" >&2
            exit 1
          fi
          printf "export const API_BASE = '%s';\nexport const CONTACT = '%s';\n" "${API_URL%/}" "$CONTACT" > public/config.js
          echo "API: ${API_URL:-none (lite mode)} · contact: ${CONTACT:-none}"
          touch public/.nojekyll

      # Give every deploy fresh asset URLs so browsers (phone Safari in
      # particular) never mix a new page with cached old scripts.
      - name: Version asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|theme\.js|app\.js|favicon\.svg|apple-touch-icon\.png|og-image\.png)\"#\1=\"\2?v=$V\"#g" public/index.html
          find public -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^'?]+\.js)'#\1?v=$V'#g" {} +
          grep -c "?v=$V" public/index.html

      - id: pages
        uses: actions/configure-pages@v5

      # Link previews (WhatsApp, X, Slack…) need an absolute image URL.
      - name: Absolute preview image URL
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: sed -i -E "s#content=\"og-image\.png(\?v=[0-9a-f]+)?\"#content=\"${BASE%/}/og-image.png\1\"#" public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
