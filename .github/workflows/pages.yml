name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
      #   SITELENS_API_URL  – a hosted Webvieu API, for full reports
      #   SITELENS_CONTACT  – email or https URL where people request API keys
      - name: Configure API endpoint and contact
        env:
          API_URL: ${{ vars.SITELENS_API_URL }}
          CONTACT: ${{ vars.SITELENS_CONTACT }}
        run: |
          if [ -n "$API_URL" ] && ! printf '%s' "$API_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$'; then
            echo "SITELENS_API_URL must be an https:// URL" >&2
            exit 1
          fi
          if [ -n "$CONTACT" ] && ! printf '%s' "$CONTACT" | grep -Eq '^([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|https://[A-Za-z0-9./?=&_%#:-]+)$'; then
            echo "SITELENS_CONTACT must be an email address or an https:// URL" >&2
            exit 1
          fi
          printf "export const API_BASE = '%s';\nexport const CONTACT = '%s';\n" "${API_URL%/}" "$CONTACT" > public/config.js
          echo "API: ${API_URL:-none (lite mode)} · contact: ${CONTACT:-none}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      # Prerender every page as real HTML (titles, descriptions, structured
      # data and content for search engines and AI crawlers), plus
      # sitemap.xml, robots.txt and llms.txt. Asset URLs get the commit hash
      # so browsers never mix a new page with cached old scripts.
      # Optional variables for search consoles (verification codes only):
      #   SITELENS_GOOGLE_VERIFICATION, SITELENS_BING_VERIFICATION
      - name: Build static site
        env:
          SITELENS_GOOGLE_VERIFICATION: ${{ vars.SITELENS_GOOGLE_VERIFICATION }}
          SITELENS_BING_VERIFICATION: ${{ vars.SITELENS_BING_VERIFICATION }}
        run: node scripts/build-static.js --out _site --site-url "${{ steps.pages.outputs.base_url }}" --version "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
