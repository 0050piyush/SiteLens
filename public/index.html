<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteLens · Website intelligence</title>
  <meta name="description" content="Free website intelligence: traffic estimates, global rank, technology stack, SEO, performance and security for any domain.">
  <meta name="theme-color" content="#2a78d6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="SiteLens home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M21 21l7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M9.5 16.5l3-4 2.5 2.5 3.5-5" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>SiteLens</span>
      </a>
      <form class="topsearch" id="topsearch" role="search">
        <input name="q" type="text" placeholder="Analyze a domain…" autocomplete="off" spellcheck="false" aria-label="Domain to analyze" list="recent-domains">
      </form>
      <nav class="nav" aria-label="Main">
        <a href="#/compare">Compare</a>
        <a href="#/top" data-needs-server class="nav-wide">Rankings</a>
        <a href="#/api" data-needs-server>API</a>
        <a href="#/pricing">Pricing</a>
        <a href="#/login" id="nav-account" data-needs-server>Log in</a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1"></main>
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>SiteLens · open-source website intelligence</span>
      <nav class="footer-links" aria-label="Footer"><a href="#/compare">Compare</a><a href="#/top" data-needs-server>Rankings</a><a href="#/api" data-needs-server>API</a><a href="#/pricing">Pricing</a></nav>
      <span class="muted">Rank data: <a href="https://tranco-list.eu" rel="noopener" target="_blank">Tranco</a> · Registration: RDAP · History: Internet Archive</span>
    </div>
  </footer>
  <datalist id="recent-domains"></datalist>
  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
